<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF7F0"/>
      <stop offset="50%" stop-color="#FFF8ED"/>
      <stop offset="100%" stop-color="#FBF0E0"/>
    </linearGradient>
    <linearGradient id="ctaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D1B4E"/>
      <stop offset="100%" stop-color="#1E1145"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2D1B4E" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="800" fill="#FBF7F0"/>

  <!-- Sticky Top Navigation -->
  <rect width="1200" height="60" fill="#FBF7F0" filter="url(#shadow)"/>
  <line x1="0" y1="60" x2="1200" y2="60" stroke="#E8E0D4" stroke-width="1"/>
  <text x="40" y="38" font-family="'Playfair Display', serif" font-size="22" font-weight="700" fill="#2D1B4E">✨ EventGenie</text>
  <text x="450" y="36" font-family="'Inter', sans-serif" font-size="14" fill="#3D2E5C">Home</text>
  <text x="530" y="36" font-family="'Inter', sans-serif" font-size="14" fill="#3D2E5C">How It Works</text>
  <text x="660" y="36" font-family="'Inter', sans-serif" font-size="14" fill="#3D2E5C">Plan My Event</text>
  <text x="790" y="36" font-family="'Inter', sans-serif" font-size="14" fill="#3D2E5C">About</text>
  <rect x="1000" y="14" width="160" height="34" rx="17" fill="#F5A623"/>
  <text x="1080" y="36" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#1C1235" text-anchor="middle">Plan My Event</text>

  <!-- Hero Section -->
  <rect x="0" y="60" width="1200" height="260" fill="url(#bgGrad)"/>
  <text x="600" y="130" font-family="'Playfair Display', serif" font-size="36" font-weight="800" fill="#2D1B4E" text-anchor="middle">Plan Your Perfect Event with AI</text>
  <text x="600" y="165" font-family="'Inter', sans-serif" font-size="15" fill="#6B5B8A" text-anchor="middle">From dream wedding to community festival — budget, timeline, vendors, and ideas in seconds.</text>
  
  <rect x="420" y="195" width="180" height="42" rx="21" fill="#F5A623"/>
  <text x="510" y="222" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#1C1235" text-anchor="middle">✨ Start Planning — Free</text>
  
  <rect x="620" y="195" width="160" height="42" rx="21" fill="none" stroke="#E8E0D4" stroke-width="2"/>
  <text x="700" y="222" font-family="'Inter', sans-serif" font-size="14" font-weight="500" fill="#2D1B4E" text-anchor="middle">📋 See Sample Plan</text>

  <!-- Hero Stats -->
  <text x="350" y="285" font-family="'Playfair Display', serif" font-size="24" font-weight="700" fill="#2D1B4E" text-anchor="middle">6</text>
  <text x="350" y="302" font-family="'Inter', sans-serif" font-size="12" fill="#6B5B8A" text-anchor="middle">Languages</text>
  
  <text x="600" y="285" font-family="'Playfair Display', serif" font-size="24" font-weight="700" fill="#2D1B4E" text-anchor="middle">3</text>
  <text x="600" y="302" font-family="'Inter', sans-serif" font-size="12" fill="#6B5B8A" text-anchor="middle">Event Types</text>
  
  <text x="850" y="285" font-family="'Playfair Display', serif" font-size="24" font-weight="700" fill="#2D1B4E" text-anchor="middle">4</text>
  <text x="850" y="302" font-family="'Inter', sans-serif" font-size="12" fill="#6B5B8A" text-anchor="middle">Outputs per Plan</text>

  <!-- Event Type Cards -->
  <rect x="80" y="340" width="320" height="200" rx="14" fill="#FFFFFF" stroke="#E8E0D4" filter="url(#shadow)"/>
  <text x="240" y="380" font-size="32" text-anchor="middle">💍</text>
  <text x="240" y="415" font-family="'Playfair Display', serif" font-size="18" font-weight="700" fill="#2D1B4E" text-anchor="middle">Wedding Planning</text>
  <text x="240" y="440" font-family="'Inter', sans-serif" font-size="12" fill="#6B5B8A" text-anchor="middle">Multi-tier ceremonies &amp; catering</text>
  <rect x="130" y="480" width="220" height="34" rx="17" fill="#FBF7F0" stroke="#E8E0D4"/>
  <text x="240" y="502" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#2D1B4E" text-anchor="middle">💍 Start Planning: Wedding</text>

  <rect x="440" y="340" width="320" height="200" rx="14" fill="#FFFFFF" stroke="#E8E0D4" filter="url(#shadow)"/>
  <text x="600" y="380" font-size="32" text-anchor="middle">🎂</text>
  <text x="600" y="415" font-family="'Playfair Display', serif" font-size="18" font-weight="700" fill="#2D1B4E" text-anchor="middle">Birthday Parties</text>
  <text x="600" y="440" font-family="'Inter', sans-serif" font-size="12" fill="#6B5B8A" text-anchor="middle">Theme-driven activities &amp; decor</text>
  <rect x="490" y="480" width="220" height="34" rx="17" fill="#FBF7F0" stroke="#E8E0D4"/>
  <text x="600" y="502" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#2D1B4E" text-anchor="middle">🎂 Start Planning: Birthday</text>

  <rect x="800" y="340" width="320" height="200" rx="14" fill="#FFFFFF" stroke="#E8E0D4" filter="url(#shadow)"/>
  <text x="960" y="380" font-size="32" text-anchor="middle">🎪</text>
  <text x="960" y="415" font-family="'Playfair Display', serif" font-size="18" font-weight="700" fill="#2D1B4E" text-anchor="middle">Community Events</text>
  <text x="960" y="440" font-family="'Inter', sans-serif" font-size="12" fill="#6B5B8A" text-anchor="middle">Festivals, permits &amp; volunteer logistics</text>
  <rect x="850" y="480" width="220" height="34" rx="17" fill="#FBF7F0" stroke="#E8E0D4"/>
  <text x="960" y="502" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#2D1B4E" text-anchor="middle">🎪 Start Planning: Community</text>

  <!-- How It Works / Steps -->
  <rect x="80" y="560" width="1040" height="90" rx="12" fill="#FFFFFF" stroke="#E8E0D4"/>
  <circle cx="160" cy="605" r="18" fill="#F5A623"/>
  <text x="160" y="611" font-family="'Playfair Display', serif" font-size="14" font-weight="700" fill="#1C1235" text-anchor="middle">1</text>
  <text x="195" y="602" font-family="'Playfair Display', serif" font-size="14" font-weight="700" fill="#2D1B4E">Tell Us Your Vision</text>
  <text x="195" y="618" font-family="'Inter', sans-serif" font-size="11" fill="#6B5B8A">Budget, date, city, and style</text>

  <circle cx="520" cy="605" r="18" fill="#F5A623"/>
  <text x="520" y="611" font-family="'Playfair Display', serif" font-size="14" font-weight="700" fill="#1C1235" text-anchor="middle">2</text>
  <text x="555" y="602" font-family="'Playfair Display', serif" font-size="14" font-weight="700" fill="#2D1B4E">AI Builds Your Plan</text>
  <text x="555" y="618" font-family="'Inter', sans-serif" font-size="11" fill="#6B5B8A">Penny-rounded math &amp; dates</text>

  <circle cx="880" cy="605" r="18" fill="#F5A623"/>
  <text x="880" y="611" font-family="'Playfair Display', serif" font-size="14" font-weight="700" fill="#1C1235" text-anchor="middle">3</text>
  <text x="915" y="602" font-family="'Playfair Display', serif" font-size="14" font-weight="700" fill="#2D1B4E">Review &amp; Refine</text>
  <text x="915" y="618" font-family="'Inter', sans-serif" font-size="11" fill="#6B5B8A">4 detailed verified tabs</text>

  <!-- CTA Banner & Footer -->
  <rect x="0" y="670" width="1200" height="70" fill="url(#ctaGrad)"/>
  <text x="600" y="700" font-family="'Playfair Display', serif" font-size="18" font-weight="700" fill="#F5F0EB" text-anchor="middle">Ready to Plan Your Next Event?</text>
  <text x="600" y="722" font-family="'Inter', sans-serif" font-size="12" fill="#B8A9D4" text-anchor="middle">100% Free · $0 Stack · Open Source on GitHub</text>

  <rect x="0" y="740" width="1200" height="60" fill="#1C1235"/>
  <text x="600" y="775" font-family="'Inter', sans-serif" font-size="11" fill="#B8A9D4" text-anchor="middle">EventGenie © 2026 — Multilingual GenAI Event Planner · All prices are benchmark estimates</text>
</svg>

